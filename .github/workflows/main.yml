name: Checkmarx One Scan
on:
  push:
    branches:
      - main
      - master
      - dev
env:
  # Checkmarx Token (從 GitHub Secrets 取得)
  CX_REFRESH_TOKEN: '4lbgkTuJev1vuehaDDBlwMHbTRCXON90'

  # Checkmarx 設定
  CX_PROJECT_NAME: 'TEST' # Checkmarx 專案名稱
  CX_BASE_URI: 'https://sng.ast.checkmarx.net'
  CX_TENANT: 'mssp-gss-cpo12igs'
  CX_CLIENT_ID: 'IGS_Client'


  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Debug - Print Environment Variables
        shell: bash
        run: |
          echo "=== 環境變數檢查 ==="
          echo "CX_PROJECT_NAME: ${{ env.CX_PROJECT_NAME }}"
          echo "CX_BASE_URI: ${{ env.CX_BASE_URI }}"
          echo "CX_TENANT: ${{ env.CX_TENANT }}"
          echo "CX_CLIENT_ID: ${{ env.CX_CLIENT_ID }}"

          # 印出 CX_REFRESH_TOKEN 的長度和隱碼版本
          TOKEN="${{ env.CX_REFRESH_TOKEN }}"
          TOKEN_LENGTH=${#TOKEN}
          echo "CX_REFRESH_TOKEN 長度: $TOKEN_LENGTH"

          if [ $TOKEN_LENGTH -gt 10 ]; then
            # 顯示前5個字元...後5個字元
            MASKED="${TOKEN:0:5}...${TOKEN: -5}"
            echo "CX_REFRESH_TOKEN (隱碼): $MASKED"
          else
            echo "CX_REFRESH_TOKEN (隱碼): [長度不足10，可能為空]"
          fi

          echo "Repository Name: ${{ github.event.repository.name }}"
          
      - name: Checkout
        uses: actions/checkout@v2
        
      - name: Checkmarx AST Github Action
        uses: Checkmarx/ast-github-action@2.3.28
        with:
          # Provide the AST portal URL
          base_uri: 'https://sng.ast.checkmarx.net'
          # Provide the Tenant for AST portal URL
          cx_tenant: 'mssp-gss-cpo12igs'
          # Client ID for AST portal authentication
          cx_client_id: 'IGS_Client'
          # Secret key for AST portal authentication
          cx_client_secret: '4lbgkTuJev1vuehaDDBlwMHbTRCXON90'
          # Select a Checkmarx Project Name
          project_name: ${{ env.CX_PROJECT_NAME }}
          # Branch name
          branch: ${{ github.event.repository.name }}
          # GitHub API Token
          github_token: ${{ github.token }}
          # Additional parameters for AST scan
          additional_params: --report-format pdf,sarif --output-name ${{ env.CX_PROJECT_NAME }} --output-path . --debug # optional, default is 
          # Repository name for PR decoration
          repo_name: ${{ github.event.repository.name }}"
          # Organization name to create the Pr comment
          namespace: ${{ github.repository_owner }}
          # Pr Number of the pull request that needs the decoration
          pr_number: ${{ github.event.number }}
      
      - name: Upload Checkmarx Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Report
          path: ${{ env.CX_PROJECT_NAME }}.pdf

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v2
        with:
          # Path to SARIF file relative to the root of the repository
          sarif_file: ${{ env.CX_PROJECT_NAME }}.sarif
